name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/docs/**'

  pull_request:
    branches:
      - main
    paths-ignore:
      - 'apps/docs/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: lts/*
          cache: true

      - run: vp install
      - run: vpr build
      - run: vp check

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: lint

    strategy:
      matrix:
        node: [lts/*]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: lts/*
          cache: true

      - run: vp install
      - run: vpr test
