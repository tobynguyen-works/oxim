packages:
  - apps/*
  - packages/*
  - playgrounds/*

catalogMode: prefer

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
  '@effect/platform-node': ^4.0.5
  '@effect/tsgo': ^0.53.5
  '@effect/vitest': ^4.0.5
  '@napi-rs/image': ^1.15.0
  '@node-rs/xxhash': ^1.7.8
  '@total-typescript/tsconfig': ^1.0.4
  '@types/node': ^22
  blume: ^2.2.3
  effect: ^4.0.5
  image-meta: ^0.3.0
  jiti: ^2.7.0
  picocolors: ^1.1.1
  pretty-bytes: ^7.2.0
  tegami: ^1.5.0
  typescript: ^7.0.2
  unstorage: ^1.17.6
  ohash: ^2.0.12
  taze: ^21.3.0

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

minimumReleaseAgeExclude:
  - '@vitest/browser-preview@5.0.5'
  - '@vitest/browser@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/pretty-format@5.0.5'
  - '@vitest/snapshot@5.0.5'
  - '@vitest/spy@5.0.5'
  - '@vitest/ui@5.0.5'
  - '@vitest/utils@5.0.5'
  - '@voidzero-dev/vite-plus-core@1.3.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.3.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.3.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.3.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0'
  - vite-plus@1.3.0
  - vitest@5.0.5
